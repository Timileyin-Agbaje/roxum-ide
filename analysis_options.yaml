include: package:flutter_lints/flutter.yaml
analyzer:
  errors:
    implementation_imports: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored code_forge: its example app and integration driver need their own packages.
    - packages/code_forge/example/**
    - packages/code_forge/test_driver/**
