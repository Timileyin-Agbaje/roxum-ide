name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [playstore-version]
    paths-ignore:
      - '**.md'
      - 'LICENCE'
  # PRs get an APK artifact to test on the phone, but no Release.
  pull_request:
    branches: [playstore-version]
    paths-ignore:
      - '**.md'
      - 'LICENCE'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  BUNDLETOOL_VERSION: '1.18.3'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # LFS objects are cached so repeat builds do not use the LFS bandwidth quota.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Write signing config
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # GitHub gives pull requests from forks no secrets, so they get analyze and test only.
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "::notice::No signing secrets for this pull request; skipping the APK."
              exit 0
            fi
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (see WP9)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The build number keeps rising with every run, so each APK installs over the last one.
      - name: Build app bundle
        if: steps.signing.outputs.ready == 'true'
        run: flutter build appbundle --release --build-number=$((1000 + ${{ github.run_number }}))

      - name: Build universal APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/roxum.apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/release.jks" \
            --ks-pass="pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASSWORD"
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APK_NAME=roxum-${version}-${{ github.run_number }}.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          unzip -p "$RUNNER_TEMP/roxum.apks" universal.apk > "roxum-${version}-${{ github.run_number }}.apk"
          ls -lh roxum-*.apk

      - name: Upload artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 14

      - name: Publish release
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Roxum ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_NAME }}
          make_latest: true
          body: |
            Universal APK built from ${{ github.sha }}.
            Download it on the phone and install it (allow "install unknown apps" for your browser).

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
